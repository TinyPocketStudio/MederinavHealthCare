<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Personal – Mederinav Health Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand"><strong>Mederinav</strong> <span>Personal</span></div>
      <div class="who"><span id="who"></span> <a class="link" href="/cdn-cgi/access/logout">Logga ut</a></div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="toolbar">
      <div class="week-nav">
        <button class="btn btn--icon" id="prev" type="button" aria-label="Föregående vecka">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="btn btn--ghost" id="this-week" type="button">Denna vecka</button>
        <button class="btn btn--icon" id="next" type="button" aria-label="Nästa vecka">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <h1 id="week-label" aria-live="polite">Bokningar</h1>
      </div>
      <div class="filters">
        <label class="visually-hidden" for="filter">Visa behandlare</label>
        <select id="filter" class="select"></select>
        <label class="check"><input type="checkbox" id="show-cancelled"> Visa avbokade</label>
        <button class="btn btn--primary" id="open-booking" type="button">+ Ny bokning</button>
        <button class="btn" id="open-block" type="button">Blockera tid</button>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="days" id="days"><p class="empty">Hämtar bokningar…</p></div>
  </main>

  <!-- Ny telefonbokning -->
  <dialog id="dlg-booking" aria-labelledby="dlg-booking-title">
    <form id="form-booking" novalidate>
      <h2 id="dlg-booking-title">Ny bokning</h2>
      <div class="grid2">
        <label>Behandling <select class="select" name="treatment" required></select></label>
        <label>Behandlare <select class="select" name="practitioner" required></select></label>
        <label>Datum <input class="input" type="date" name="date" required></label>
        <label>Tid <select class="select" name="time" required></select></label>
        <label>Namn <input class="input" name="name" autocomplete="off" required></label>
        <label>Telefon <input class="input" name="phone" type="tel" autocomplete="off" required></label>
        <label>E-post <span class="opt">(valfritt)</span> <input class="input" name="email" type="email" autocomplete="off"></label>
        <label>Språk för mejl
          <select class="select" name="lang"><option value="sv">Svenska</option><option value="es">Spanska</option></select>
        </label>
      </div>
      <label>Meddelande / anteckning <span class="opt">(valfritt)</span> <textarea class="input" name="message" rows="2"></textarea></label>
      <label class="check"><input type="checkbox" name="sendConfirmation"> Skicka bekräftelse till patientens e-post</label>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button class="btn btn--ghost" type="button" data-close>Avbryt</button>
        <button class="btn btn--primary" type="submit">Spara bokning</button>
      </div>
    </form>
  </dialog>

  <!-- Blockera tid -->
  <dialog id="dlg-block" aria-labelledby="dlg-block-title">
    <form id="form-block" novalidate>
      <h2 id="dlg-block-title">Blockera tid</h2>
      <p class="hint">Blockerad tid kan inte bokas på webben, t.ex. semester, sjukdom eller lunch.</p>
      <label>Gäller <select class="select" name="practitioner"></select></label>
      <div class="grid2">
        <label>Från datum <input class="input" type="date" name="from" required></label>
        <label>Till och med <input class="input" type="date" name="to"></label>
      </div>
      <label class="check"><input type="checkbox" name="allDay" checked> Hela dagen</label>
      <div class="grid2" data-times hidden>
        <label>Från kl. <input class="input" type="time" name="start" step="1800" value="12:00"></label>
        <label>Till kl. <input class="input" type="time" name="end" step="1800" value="13:00"></label>
      </div>
      <label>Anteckning <span class="opt">(t.ex. Semester)</span> <input class="input" name="note" maxlength="200"></label>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button class="btn btn--ghost" type="button" data-close>Avbryt</button>
        <button class="btn btn--primary" type="submit">Blockera</button>
      </div>
    </form>
  </dialog>

  <!-- Avboka -->
  <dialog id="dlg-cancel" aria-labelledby="dlg-cancel-title">
    <form id="form-cancel" novalidate>
      <h2 id="dlg-cancel-title">Avboka tiden?</h2>
      <p id="cancel-summary"></p>
      <label class="check" data-notify><input type="checkbox" name="notify" checked> Skicka avbokningsmejl till patienten</label>
      <p class="hint" data-no-email hidden>Patienten har ingen e-postadress – ring och meddela i stället.</p>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button class="btn btn--ghost" type="button" data-close>Behåll tiden</button>
        <button class="btn btn--danger" type="submit">Avboka</button>
      </div>
    </form>
  </dialog>
</body>
</html>
